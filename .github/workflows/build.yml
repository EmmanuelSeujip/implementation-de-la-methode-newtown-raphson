name: Build multi-OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # ─── Linux ───────────────────────────────────────────────────────
      - name: Installer dépendances (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bison flex

      # ─── macOS ───────────────────────────────────────────────────────
      - name: Installer dépendances (macOS)
        if: runner.os == 'macOS'
        run: brew install bison flex

      # ─── Windows ─────────────────────────────────────────────────────
      - name: Installer dépendances (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-bison mingw-w64-x86_64-flex make

      # ─── Compilation ─────────────────────────────────────────────────
      - name: Compiler (Linux / macOS)
        if: runner.os != 'Windows'
        run: make

      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make

      # ─── Upload des binaires ──────────────────────────────────────────
      - name: Upload binaire Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binaire-linux
          path: main[linux]

      - name: Upload binaire macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: binaire-macos
          path: main[macos]

      - name: Upload binaire Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaire-windows
          path: main[windows].exe